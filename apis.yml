name: Adyton
description: 'Adyton (Adyton PBC) is a veteran-founded defense technology company building
  secure, mobile-first, zero-trust software for the U.S. military and defense enterprises.
  Founded in 2019 by Special Forces veterans James Boyd and JJ Wilson, Adyton delivers
  the Adyton Operations Kit (AOK) — a mobile productivity suite whose modules include
  Mustr (real-time personnel accountability and muster), Log-E (distributed logistics
  and equipment/hand-receipt tracking), and Skeds (planning and scheduling) — plus the
  Atlas edge platform for disconnected, denied, disrupted, and intermittent (DDIL)
  environments. The platform is engineered for IL5/IL6, FIPS 140-2 Level 3 encryption,
  FedRAMP+ and NIST 800-53r5 controls, runs on AWS GovCloud, and supports CAC/PIV,
  WebAuthn/FIDO2, and OAuth2 authentication. Added to the API Evangelist network as a
  portfolio company of Initialized Capital and Kindred Ventures.'
